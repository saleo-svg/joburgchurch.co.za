<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager — Johannesburg Bible Study Church</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </head>
  <body>
    <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Sveltia will auto-mount when it sees the script tag,
      // but we provide a small loading fallback in case the CDN is slow.
      window.addEventListener('error', function (e) {
        var mount = document.getElementById('sveltia-fallback');
        if (mount) {
          mount.style.display = 'block';
          mount.textContent = 'CMS failed to load. Please refresh the page or check the browser console.';
        }
      });
    </script>
    <div id="sveltia-fallback" style="display:none; padding: 2rem; max-width: 32rem; margin: 4rem auto; font-family: sans-serif; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;"></div>

    <!-- ============================================================ -->
    <!-- Volunteer guide link (visible even if Sveltia fails to load) -->
    <!-- ============================================================ -->
    <div style="position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; max-width: 18rem; padding: 0.85rem 1rem; background: #ffffff; border: 1px solid #c8862f; border-radius: 8px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
      <div style="font-size: 0.8rem; color: #6b7280; margin-bottom: 0.35rem; letter-spacing: 0.04em;">📖 FIRST TIME HERE?</div>
      <a href="/admin-guide/" style="display: inline-block; color: #1e3a5f; font-weight: 600; text-decoration: none; font-size: 0.9rem;">
        Volunteer Guide · 자원봉사자 안내 →
      </a>
    </div>
  </body>
</html>
