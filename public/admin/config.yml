# Sveltia CMS Backend
# See: https://sveltiacms.app/en/docs/backends/github
#
# STEP 1: Create GitHub OAuth App at https://github.com/settings/developers
#   Application name: JHB Bible Study Church CMS
#   Homepage URL: https://joburgchurch.co.za
#   Authorization callback URL: https://joburgchurch-cms-auth.<your-subdomain>.workers.dev/callback
#
# STEP 2: Deploy sveltia-cms-auth Worker to Cloudflare Workers
#   Repo: https://github.com/sveltia/sveltia-cms-auth
#   Click "Deploy to Cloudflare Workers" button
#   Set environment variables:
#     GITHUB_CLIENT_ID = <from step 1>
#     GITHUB_CLIENT_SECRET = <from step 1>
#
# STEP 3: Replace YOUR_WORKER_URL below with your deployed worker URL
#
# The collections defined here MUST match src/content/config.ts.
# If you add a new collection, update both files in the same PR.

backend:
  name: github
  repo: saleo-svg/joburgchurch.co.za
  branch: master
  base_url: https://joburgchurch-cms-auth.YOUR_SUBDOMAIN.workers.dev  # ← UPDATE AFTER DEPLOYING WORKER
  auth_endpoint: callback
  open_authoring: false
  squash_merges: true
  commit_messages:
    create: 'cms: create {{collection}} "{{slug}}"'
    update: 'cms: update {{collection}} "{{slug}}"'
    delete: 'cms: delete {{collection}} "{{slug}}"'
    uploadMedia: 'cms: upload media "{{path}}"'
    deleteMedia: 'cms: delete media "{{path}}"'
    openAuthoring: 'cms: {{message}}'

# Media files are committed to the repo
media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

# Search index for collections
search: true

# Site URL
site_url: https://joburgchurch.co.za
display_url: https://joburgchurch.co.za
logo_url: https://joburgchurch.co.za/images/og-default.svg

# Locale
locale: en

# Collections
# Each collection is mirrored in src/content/config.ts.
collections:

  # ============================================
  # Blog Posts (folder: src/content/posts)
  # ============================================
  - name: blog
    label: 'Blog Posts'
    label_singular: 'Blog Post'
    description: 'Articles, devotionals, and Bible study reflections. Target SEO long-tail keywords.'
    folder: 'src/content/posts'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Title', name: 'title', widget: 'string'}
      - {label: 'Description', name: 'description', widget: 'text'}
      - {label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD'}
      - {label: 'Author', name: 'author', widget: 'string', default: 'Mr. Sim'}
      - {label: 'Tags', name: 'tags', widget: 'list', required: false}
      - {label: 'Image', name: 'image', widget: 'image', required: false, allow_multiple: false}
      - {label: 'Hero Image', name: 'heroImage', widget: 'image', required: false, allow_multiple: false, hint: 'Optional larger image for the post header'}
      - {label: 'Excerpt', name: 'excerpt', widget: 'text', required: false}
      - {label: 'Is Hymn?', name: 'isHymn', widget: 'boolean', required: false, default: false, hint: 'Mark true to also appear on /hymns/'}
      - {label: 'Language', name: 'language', widget: 'select', options: ['English', 'Zulu', 'Xhosa', 'Sotho', 'Tswana', 'Swahili', 'Dinka', 'Nuer', 'Shona', 'Korean', 'Lingala', 'French', 'Portuguese', 'Other'], required: false, hint: 'For hymns only'}
      - {label: 'Key (Chord Key)', name: 'key', widget: 'string', required: false, hint: 'e.g. G, C, Dm — for hymns only'}
      - {label: 'Chords', name: 'chords', widget: 'string', required: false, hint: 'e.g. G - D - Em - C — for hymns only'}
      - {label: 'Download (.docx)', name: 'download', widget: 'file', required: false, hint: 'Upload .docx with chords/notation for hymns'}
      - {label: 'Body', name: 'body', widget: 'markdown'}
    view_filters:
      - {label: 'Hymns only', field: 'isHymn'}
    view_groups:
      - {label: 'Year', field: 'date'}

  # ============================================
  # Sermon Series (folder: src/content/sermons)
  # ============================================
  - name: sermons
    label: 'Sermons & Bible Studies'
    label_singular: 'Sermon'
    description: 'Sermon series and Bible study recordings with YouTube links.'
    folder: 'src/content/sermons'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Title', name: 'title', widget: 'string'}
      - {label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD'}
      - {label: 'Series', name: 'series', widget: 'string'}
      - {label: 'Speaker', name: 'speaker', widget: 'select', options: ['Mr. Sim', 'Ms. Dora', 'Guest']}
      - {label: 'Passage', name: 'passage', widget: 'string', required: false}
      - {label: 'YouTube ID', name: 'youtube_id', widget: 'string', required: false, hint: 'The part after youtu.be/ or v='}
      - {label: 'Duration', name: 'duration', widget: 'string', required: false, hint: 'e.g. 24:18'}
      - {label: 'Description', name: 'description', widget: 'text'}
      - {label: 'Body / Notes', name: 'body', widget: 'markdown', required: false}
    view_groups:
      - {label: 'Series', field: 'series'}
      - {label: 'Year', field: 'date'}

  # ============================================
  # Events (folder: src/content/events)
  # ============================================
  - name: events
    label: 'Events'
    label_singular: 'Event'
    description: 'Special events, gatherings, picnics, classes.'
    folder: 'src/content/events'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Title', name: 'title', widget: 'string'}
      - {label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', picker_utc: false}
      - {label: 'End Date', name: 'end_date', widget: 'datetime', format: 'YYYY-MM-DD', required: false}
      - {label: 'Time', name: 'time', widget: 'string', hint: 'e.g. 2:00pm - 4:00pm'}
      - {label: 'Location', name: 'location', widget: 'select', options: ['Parkmore, Sandton', 'Online (Google Meet)', 'Fourways', 'Randburg', 'Midrand', 'Other']}
      - {label: 'Address', name: 'address', widget: 'string', required: false}
      - {label: 'Category', name: 'category', widget: 'select', options: ['Bible Study', 'Korean Class', 'Youth (UseCan)', 'Community', 'Special Event']}
      - {label: 'Description', name: 'description', widget: 'text'}
      - {label: 'Registration Required', name: 'registration_required', widget: 'boolean', default: false}
      - {label: 'Image', name: 'image', widget: 'image', required: false}
      - {label: 'Body', name: 'body', widget: 'markdown', required: false}
    view_groups:
      - {label: 'Year', field: 'date'}

  # ============================================
  # Gallery (folder: src/content/gallery)
  # ============================================
  - name: gallery
    label: 'Photo Gallery'
    label_singular: 'Photo'
    description: 'Community photos — Bible study, Korean class, youth events, picnics.'
    folder: 'src/content/gallery'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Title', name: 'title', widget: 'string'}
      - {label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD'}
      - {label: 'Photo', name: 'photo', widget: 'image', allow_multiple: false, hint: 'Upload to public/images/uploads/'}
      - {label: 'Category', name: 'category', widget: 'select', options: ['Bible Study', 'Korean Class', 'Youth (UseCan)', 'Community', 'Worship', 'Other']}
      - {label: 'Caption', name: 'caption', widget: 'text', required: false}
      - {label: 'Alt Text', name: 'alt', widget: 'string', hint: 'For screen readers and SEO. Describe the photo briefly.'}
      - {label: 'Photographer', name: 'photographer', widget: 'string', required: false}
    view_groups:
      - {label: 'Category', field: 'category'}

  # ============================================
  # Videos (folder: src/content/videos)
  # ============================================
  - name: videos
    label: 'Videos'
    label_singular: 'Video'
    description: 'YouTube videos — sermons, Bible study recordings, community highlights.'
    folder: 'src/content/videos'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Title', name: 'title', widget: 'string'}
      - {label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD'}
      - {label: 'YouTube ID', name: 'youtube_id', widget: 'string'}
      - {label: 'Category', name: 'category', widget: 'select', options: ['Bible Study', 'Sermon', 'Korean Class', 'Youth', 'Teaching', 'Community', 'Testimony']}
      - {label: 'Speaker', name: 'speaker', widget: 'string', required: false}
      - {label: 'Passage', name: 'passage', widget: 'string', required: false, hint: 'e.g. John 3:1-21'}
      - {label: 'Duration', name: 'duration', widget: 'string', required: false}
      - {label: 'Description', name: 'description', widget: 'text'}
      - {label: 'Featured', name: 'featured', widget: 'boolean', default: false, hint: 'Show on homepage hero?'}
    view_groups:
      - {label: 'Category', field: 'category'}

  # ============================================
  # Site Settings (single file)
  # ============================================
  - name: settings
    label: 'Site Settings'
    label_singular: 'Setting'
    description: 'Single-file settings for service times, contact info, etc.'
    files:
      - name: 'general'
        label: 'General Settings'
        file: 'src/content/settings/general.md'
        fields:
          - {label: 'Church Name', name: 'church_name', widget: 'string'}
          - {label: 'Tagline', name: 'tagline', widget: 'string'}
          - {label: 'Bible Study Time', name: 'bible_study_time', widget: 'string', hint: 'e.g. Wednesday 7:30pm'}
          - {label: 'Korean Class Time', name: 'korean_class_time', widget: 'string', hint: 'e.g. Sunday 2:00pm'}
          - {label: 'Phone Mr. Sim', name: 'phone_sim', widget: 'string'}
          - {label: 'Phone Ms. Dora', name: 'phone_dora', widget: 'string'}
          - {label: 'Address', name: 'address', widget: 'string'}
          - {label: 'Welcome Message', name: 'welcome_message', widget: 'text'}

  # ============================================
  # Hymns / Songs Suggestions (folder: src/content/hymn-suggestions)
  # Admin reviews; approved ones are moved to the blog collection as isHymn:true
  # ============================================
  - name: hymnSuggestions
    label: 'Hymn Suggestions'
    label_singular: 'Hymn Suggestion'
    description: 'Submit new hymn or song suggestions for review. Admin will add approved songs to the main collection.'
    folder: 'src/content/hymn-suggestions'
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: 'Song Title', name: 'title', widget: 'string'}
      - {label: 'Language', name: 'language', widget: 'select', options: ['Zulu', 'Xhosa', 'Sotho', 'Tswana', 'Pedi', 'Ndebele', 'Afrikaans', 'Swahili', 'Dinka', 'Shona', 'Lingala', 'Igbo', 'Yoruba', 'Amharic', 'English', 'Korean', 'Other']}
      - {label: 'Region / Country', name: 'region', widget: 'string', hint: 'e.g. South Africa, Zimbabwe, Nigeria, Korea'}
      - {label: 'Artist / Origin', name: 'artist', widget: 'string', required: false, hint: 'e.g. Traditional, Hillsong, Sinach'}
      - {label: 'Chord Key', name: 'key', widget: 'string', required: false, hint: 'e.g. G, C, Dm'}
      - {label: 'Chord Progression', name: 'chords', widget: 'string', required: false, hint: 'e.g. G - D - Em - C'}
      - {label: 'YouTube Search Term', name: 'youtube_search', widget: 'string', required: false, hint: 'Search term to find this song on YouTube'}
      - {label: 'YouTube Video ID', name: 'youtube_id', widget: 'string', required: false, hint: 'Full YouTube video ID (after youtu.be/)'}
      - {label: 'Lyrics', name: 'lyrics', widget: 'markdown', required: false, hint: 'Paste lyrics here if you have them'}
      - {label: 'Notes', name: 'notes', widget: 'text', required: false, hint: 'Any additional notes or context about this song'}
      - {label: 'Submitted By', name: 'submitted_by', widget: 'string', hint: 'Your name'}
      - {label: 'Status', name: 'status', widget: 'select', options: ['pending', 'approved', 'rejected'], default: 'pending', hint: 'Admin: set to approved after moving to blog'}
